<div class="run-table-tabs">{% include "admin/registry/_tab_actions.html" %}<nav class="run-saved-tabs" aria-label="Saved workshop mod views">
  {% for pref in saved_tabs %}<a draggable="true" data-tab-id="{{ pref.view_id }}" {% if not pref.view.system_key %}{% if pref.view.shared and can_share_views or not pref.view.shared and pref.view.owner_id == request.user.pk %}data-tab-deletable="true" data-tab-shared="{{ pref.view.shared|yesno:'true,false' }}"{% endif %}{% endif %} href="?view={{ pref.view_id }}"{% if selected_view.pk == pref.view_id %} aria-current="page"{% endif %}>{{ pref.view.name }}{% if pref.view.shared %}<span class="view-scope">Shared</span>{% endif %}</a>{% endfor %}
</nav></div>
