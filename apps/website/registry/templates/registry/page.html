{% extends "registry/base.html" %}

{% block title_suffix %} | {{ managed_page.title }}{% endblock %}

{% block content %}
<div class="managed-page managed-page-width-{{ managed_page.content_width }}">
    {% for section in managed_page.sections.all %}
        {% if section.is_visible %}
            {% include "registry/sections/managed.html" %}
        {% endif %}
    {% endfor %}
</div>
{% endblock %}
