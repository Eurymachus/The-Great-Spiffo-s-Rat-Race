<section class="card managed-section managed-tabs managed-tabs-{{ section.tabs_orientation }} managed-section-width-{{ section.width }} managed-section-background-{{ section.background }} managed-section-padding-{{ section.vertical_padding }}{% if section.full_bleed_background %} managed-section-full-bleed{% endif %}" data-managed-tabs>
    <div class="managed-tab-list" role="tablist" aria-label="{{ section.name }}" aria-orientation="{{ section.tabs_orientation }}">
        {% for tab in section.render_tabs %}
        <button
            type="button"
            class="managed-tab{% if tab.config.is_default %} is-active{% endif %}"
            id="managed-tab-{{ section.pk }}-{{ tab.index }}"
            role="tab"
            aria-selected="{% if tab.config.is_default %}true{% else %}false{% endif %}"
            aria-controls="managed-tab-panel-{{ section.pk }}-{{ tab.index }}"
            tabindex="{% if tab.config.is_default %}0{% else %}-1{% endif %}"
            data-tab-slug="{{ tab.config.slug }}"
        >
            <strong>{{ tab.config.label }}</strong>
            {% if tab.config.description %}<span>{{ tab.config.description }}</span>{% endif %}
        </button>
        {% endfor %}
    </div>
    <div class="managed-tab-panels">
        {% for tab in section.render_tabs %}
        <div
            class="managed-tab-panel{% if tab.config.is_default %} is-active{% endif %}"
            id="managed-tab-panel-{{ section.pk }}-{{ tab.index }}"
            role="tabpanel"
            aria-labelledby="managed-tab-{{ section.pk }}-{{ tab.index }}"
            data-tab-panel="{{ tab.config.slug }}"
        >
            {% for block in tab.blocks %}
                {% include "registry/blocks/block.html" %}
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</section>
