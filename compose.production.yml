name: rat-race

x-website-service: &website-service
  build:
    context: .
    dockerfile: apps/website/Dockerfile
  env_file:
    - .env.production
  environment:
    DJANGO_SETTINGS_MODULE: config.settings_production
    POSTGRES_HOST: database
    REDIS_URL: redis://cache:6379/0
    STEAMCMD_EXECUTABLE: /home/rat-race/steamcmd/steamcmd.sh
    JAVA_EXECUTABLE: /usr/bin/java
    VINEFLOWER_JAR: /opt/rat-race/runtime/vineflower.jar
    STATIC_ROOT: /srv/rat-race/static
    MEDIA_ROOT: /srv/rat-race/media
    AVATAR_QUARANTINE_ROOT: /srv/rat-race/private/avatars
    PZ_REFERENCE_ROOT: /srv/rat-race/reference
    PZ_DECOMPILED_ROOT: /srv/rat-race/decompiled
  volumes:
    - static-data:/srv/rat-race/static
    - media-data:/srv/rat-race/media
    - private-data:/srv/rat-race/private
    - reference-data:/srv/rat-race/reference
    - decompiled-data:/srv/rat-race/decompiled
    - steam-session:/home/rat-race/.steam
    - ./deployment/runtime:/opt/rat-race/runtime:ro
  depends_on:
    database:
      condition: service_healthy
    cache:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *website-service
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.parse, urllib.request;
          host=urllib.parse.urlparse(os.environ['SITE_PUBLIC_URL']).hostname;
          request=urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'Host': host});
          urllib.request.urlopen(request, timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  reference-worker:
    <<: *website-service
    command: ["python", "manage.py", "run_reference_update_worker"]

  database:
    image: postgres:17-alpine
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data:
  private-data:
  reference-data:
  decompiled-data:
  steam-session:
